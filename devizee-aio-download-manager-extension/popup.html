<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Devizee Extension</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0f18;
      color: #f1f5f9;
      padding: 16px;
      font-size: 13px;
      user-select: none;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e293b;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -0.01em;
    }

    .brand-badge {
      background: #7c3aed;
      color: white;
      width: 22px;
      height: 22px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    .status-pill {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 9999px;
      font-weight: 600;
    }

    .status-active {
      background: rgba(124, 58, 237, 0.2);
      color: #c4b5fd;
    }

    .status-paused {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
    }

    .pause-container {
      margin-bottom: 14px;
    }

    .btn-pause {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid transparent;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .btn-pause.active-state {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.4);
    }

    .btn-pause.active-state:hover {
      background: rgba(239, 68, 68, 0.25);
    }

    .btn-pause.paused-state {
      background: #7c3aed;
      color: #ffffff;
      border-color: #7c3aed;
    }

    .btn-pause.paused-state:hover {
      background: #6d28d9;
    }

    .card {
      background: #131b26;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .media-info {
      font-size: 12px;
      color: #cbd5e1;
      margin-bottom: 10px;
      word-break: break-word;
      line-height: 1.4;
    }

    .btn-send {
      width: 100%;
      padding: 8px 12px;
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-send:hover {
      background: #6d28d9;
    }

    .btn-send:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 0;
    }

    .toggle-label {
      font-size: 12px;
      color: #e2e8f0;
      font-weight: 500;
    }

    .toggle-sub {
      font-size: 10px;
      color: #64748b;
      display: block;
      margin-top: 1px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 34px;
      height: 18px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #334155;
      transition: .2s;
      border-radius: 18px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }

    input:checked+.slider {
      background-color: #7c3aed;
    }

    input:checked+.slider:before {
      transform: translateX(16px);
    }

    .divider {
      height: 1px;
      background: #1e293b;
      margin: 6px 0;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #1e293b;
      font-size: 11px;
      color: #64748b;
    }

    .footer a {
      color: #a78bfa;
      text-decoration: none;
      cursor: pointer;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="brand">
      <div class="brand-badge">▼</div>
      <span>Devizee Relay</span>
    </div>
    <span id="statusBadge" class="status-pill status-active">Active</span>
  </div>

  <div class="pause-container">
    <button id="pauseBtn" class="btn-pause active-state">
      <span id="pauseIcon">⏸</span>
      <span id="pauseText">Pause Link Grabbing</span>
    </button>
  </div>

  <div class="card">
    <div class="card-title">Current Tab Media</div>
    <div id="tabMediaStatus" class="media-info">Checking active tab...</div>
    <button id="sendTabBtn" class="btn-send" disabled>Send to Devizee</button>
  </div>

  <div class="card">
    <!-- Floating On-Page Grabber Toggle -->
    <div class="toggle-row">
      <div>
        <span class="toggle-label">Floating Grabber Pill</span>
        <span class="toggle-sub">Show draggable button on video sites</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="pillToggle">
        <span class="slider"></span>
      </label>
    </div>

    <div class="divider"></div>

    <!-- Passive Download Interception Toggle -->
    <div class="toggle-row">
      <div>
        <span class="toggle-label">Intercept Downloads</span>
        <span class="toggle-sub">Catch browser files &gt; 10MB</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="interceptToggle">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="footer">
    <span>Devizee v0.1.0</span>
    <a id="optionsLink">Extension Settings ↗</a>
  </div>

  <script src="popup.js"></script>
</body>

</html>
